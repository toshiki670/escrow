[package]
name = "escrow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# バイナリ名は escrow。#3 の Cask が Contents/MacOS/escrow を PATH へ繋ぎ、
# #4 の外部インターフェースも escrow を呼ぶ前提で書かれている。
[[bin]]
name = "escrow"
path = "src/main.rs"

[dependencies]
escrow-domain.workspace = true
escrow-config.workspace = true
escrow-ledger.workspace = true
escrow-core.workspace = true
escrow-scheduler.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
