# Xcode の project を生成する種（#79）。`build.sh` が xcodegen で毎回作るので、`.xcodeproj` は
# commit しない —— pbxproj は差分が読めない。
#
# 組み立て（`.app` の形・Info.plist・署名）は Xcode が行う。

name: Escrow
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    # ad-hoc 署名（#3「署名」）。Apple Silicon が起動するのは署名の有る実行ファイルだけ。
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    # Rust 側の staticlib は aarch64-apple-darwin だけ（rust-toolchain.toml）。#3 の対象も
    # Apple Silicon。宣言しないと、建てる arch を xcodebuild の destination 選びに任せることになる。
    ARCHS: arm64
    # 使っていない部分を落とす。Xcode の素の既定は NO で、app の template が YES にしている。
    DEAD_CODE_STRIPPING: "YES"
    # 警告で落とす。`cargo clippy -- -D warnings` に当たる層（CONTRIBUTING.md「検査の3層」）。
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    # Swift の層が `import EscrowFFI` で読む C の層。header と modulemap は `build.sh` が置く。
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/EscrowFFI
  configs:
    debug:
      ESCROW_RUST_TARGET_DIR: $(SRCROOT)/../../target/debug
    release:
      ESCROW_RUST_TARGET_DIR: $(SRCROOT)/../../target/release
      # 記号を落とす。Xcode が既定で落とすのは archive のときだけで、配るのは build の出来上がり。
      DEPLOYMENT_POSTPROCESSING: "YES"
      STRIP_INSTALLED_PRODUCT: "YES"

targets:
  # UniFFI が生成する Swift の層。`build.sh` が置く。手で書く層と分けるのは、UniFFI の Swift 6
  # 対応が部分的で、生成コードだけ Swift 5 の言語モードで建てるため。
  EscrowBindings:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/EscrowBindings
    settings:
      base:
        SWIFT_VERSION: "5.0"
    preBuildScripts:
      # Xcode の Run ボタンは Rust 側を建て直さない。生成した層と繋ぐ staticlib の版が食い違うと、
      # UniFFI が起動時の照合で止まるので、ここで揃える。中身は build.sh が呼ぶものと同じ。
      - name: Rust 側を建てて Swift が読む層を生成する
        script: '"$SRCROOT/rust.sh" "$([ "$CONFIGURATION" = Release ] && echo release || echo debug)"'
        basedOnDependencyAnalysis: false

  EscrowUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/EscrowUITests
    dependencies:
      - target: Escrow
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Escrow
        GENERATE_INFOPLIST_FILE: "YES"

  Escrow:
    type: application
    platform: macOS
    sources:
      - path: Sources/Escrow
    dependencies:
      - target: EscrowBindings
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: ja
        # #3 の `.app` の形（`Contents/MacOS/escrow-gui`）。
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
    settings:
      base:
        # `.app` は Escrow、中の実行ファイルは escrow-gui。CLI の `escrow` と APFS（大文字小文字を
        # 区別しない）で同じファイルにならないよう、大文字小文字では分けない。
        PRODUCT_NAME: Escrow
        EXECUTABLE_NAME: escrow-gui
        PRODUCT_BUNDLE_IDENTIFIER: com.github.toshiki670.escrow
        SWIFT_VERSION: "6.0"
        OTHER_SWIFT_FLAGS: -default-isolation MainActor -enable-upcoming-feature NonisolatedNonsendingByDefault
        LIBRARY_SEARCH_PATHS: $(ESCROW_RUST_TARGET_DIR)
        # staticlib と、それが要るもの。挙げたのは `cargo rustc -- --print native-static-libs`
        # （Security と CoreFoundation は上の sdk の2行）。
        OTHER_LDFLAGS: -lescrow_ffi -liconv
    scheme:
      testTargets:
        - EscrowUITests
    postBuildScripts:
      - name: CLI を同じ .app へ入れる
        script: cp -f "$ESCROW_RUST_TARGET_DIR/escrow" "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/escrow"
        inputFiles:
          - $(ESCROW_RUST_TARGET_DIR)/escrow
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(EXECUTABLE_FOLDER_PATH)/escrow
