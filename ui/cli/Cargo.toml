[package]
name = "escrow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# バイナリ名は escrow。#3 の Cask が Contents/MacOS/escrow を PATH へ繋ぎ、
# #4 の外部インターフェースも escrow を呼ぶ前提で書いてある。
[[bin]]
name = "escrow"
path = "src/main.rs"

# 段5 の入口。組み立てる crate だけを見る（#82）。
[dependencies]
escrow-app.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
