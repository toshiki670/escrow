[workspace]
resolver = "3"
members = [
    "crates/escrow-domain",
    "crates/escrow-ledger",
    "crates/escrow-core",
    "crates/escrow-adapter",
    "crates/escrow-scheduler",
    "crates/escrow-cli",
    "crates/escrow-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/toshiki670/escrow"

[workspace.dependencies]
escrow-domain = { path = "crates/escrow-domain" }
escrow-ledger = { path = "crates/escrow-ledger" }
escrow-core = { path = "crates/escrow-core" }
escrow-adapter = { path = "crates/escrow-adapter" }
escrow-scheduler = { path = "crates/escrow-scheduler" }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
directories = "6.0"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "http2", "charset"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0"
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "macros", "process", "io-util"] }
toml = "1.1"
url = "2.5"
which = "8.0"

tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
