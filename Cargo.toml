[workspace]
resolver = "3"
members = [
    "app",
    "app/crates/domain",
    "app/crates/event-store",
    "app/crates/config",
    "app/crates/scheduler",
    "app/crates/scheduler/external",
    "app/crates/slices/*",
    "ui/cli",
    "ui/gui",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/toshiki670/escrow"

[workspace.dependencies]
escrow-domain = { path = "app/crates/domain" }
escrow-event-store = { path = "app/crates/event-store" }
escrow-config = { path = "app/crates/config" }
escrow-external = { path = "app/crates/scheduler/external" }
escrow-scheduler = { path = "app/crates/scheduler" }
escrow-discovery = { path = "app/crates/slices/discovery" }
escrow-acquisition = { path = "app/crates/slices/acquisition" }
escrow-transcription = { path = "app/crates/slices/transcription" }
escrow-custody = { path = "app/crates/slices/custody" }
escrow-handover = { path = "app/crates/slices/handover" }
escrow-app = { path = "app" }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
# 識別子の newtype。const fn new と Display と i64 への変換を出す。
derive_more = { version = "2.1", default-features = false, features = ["std", "constructor", "display", "into"] }
directories = "6.0"
# GUI。tokio feature を指定するのは、既定の executor が futures の thread-pool で、
# sqlx の tokio と噛み合わないため（#7）。
iced = { version = "0.14", features = ["tokio"] }
# 画面を窓なしで動かして確かめる。iced と同じ版で、同じ repository が出している。
iced_test = "0.14"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "http2", "charset"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0"
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "macros", "process", "io-util", "time", "sync"] }
toml = "1.1"
url = "2.5"
which = "8.0"

tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
