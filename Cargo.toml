[workspace]
resolver = "3"
members = ["crates/escrow-core", "crates/escrow-cli", "crates/escrow-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/toshiki670/escrow"

[workspace.dependencies]
escrow-core = { path = "crates/escrow-core" }
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt", "macros"] }
toml = "1.1"
url = "2.5"
which = "8.0"

tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
